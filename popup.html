<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 320px;
        font-family: sans-serif;
        padding: 12px;
      }
      h2 {
        font-size: 15px;
        margin-bottom: 10px;
      }
      .item {
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 8px;
      }
      .item p {
        margin: 0 0 4px;
        font-size: 13px;
      }
      .item small {
        color: #6b7280;
        font-size: 11px;
      }
      .item a {
        font-size: 11px;
        color: #4f46e5;
        text-decoration: none;
      }
      .delete {
        float: right;
        cursor: pointer;
        color: #ef4444;
        font-size: 12px;
      }
      #empty {
        color: #9ca3af;
        font-size: 13px;
      }
      #clear-all {
        margin-top: 8px;
        font-size: 12px;
        color: #ef4444;
        cursor: pointer;
        background: none;
        border: none;
      }
    </style>
  </head>
  <body>
    <h2>📌 Saved Highlights</h2>
    <div id="list"></div>
    <button id="clear-all">Clear all</button>
    <script src="popup.js"></script>
  </body>
</html>
